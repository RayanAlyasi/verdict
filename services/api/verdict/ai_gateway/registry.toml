# Which model serves each task role, and what each model can do and costs.
# Switch models here, not in code; the eval set decides which models qualify (docs/ARCHITECTURE.md).
# Prices are US dollars per million tokens, from
# https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-24).
# cache_write is the five-minute cache, the only kind the gateway writes.

[roles]
extract = "anthropic:claude-haiku-5-5"
generate = "anthropic:claude-sonnet-5-5"
verify = "anthropic:claude-sonnet-5-5"
tutor = "anthropic:claude-haiku-5-5"
# embed has no model yet: Anthropic offers none, and spec 001 chooses one.

[models."anthropic:claude-sonnet-5-5"]
context_tokens = 1_000_000
max_output_tokens = 128_000
vision = true
structured_output = true
prompt_caching = "explicit"
batch = true

[[models."anthropic:claude-sonnet-5-5".prices]]
input = 2.00
cache_write = 2.50
cache_read = 0.10
output = 10.00

[models."anthropic:claude-haiku-5-5"]
context_tokens = 1_000_000
max_output_tokens = 128_000
vision = true
structured_output = true
prompt_caching = "explicit"
batch = true

# Haiku 5.5 charges five times as much for prompts over 100,000 tokens.
[[models."anthropic:claude-haiku-5-5".prices]]
up_to_input_tokens = 100_000
input = 0.10
cache_write = 0.125
cache_read = 0.01
output = 0.50

[[models."anthropic:claude-haiku-5-5".prices]]
input = 0.50
cache_write = 0.625
cache_read = 0.05
output = 2.50
