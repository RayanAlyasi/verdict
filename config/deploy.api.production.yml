# Production, public and reached only through its own Cloudflare Tunnel.
proxy:
  hosts:
    - verdict.alyasi.tech
    - verdict-api-production

env:
  clear:
    APP_ENV: production
    DEPLOYMENT_MODE: hosted

accessories:
  tunnel:
    service: verdict-production-tunnel
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    host: <%= ENV.fetch("KAMAL_HOST") %>
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN:CLOUDFLARE_TUNNEL_TOKEN
    options:
      memory: 128m
  # Nightly full backups and the monthly restore check (config/db/bin/db-schedule.sh), from the
  # database's own image. It reads the data folder while Postgres runs, so read-only.
  backup:
    service: verdict-production-backup
    image: "ghcr.io/rayanalyasi/verdict/db:<%= ENV["APP_VERSION"] %>"
    host: <%= ENV.fetch("KAMAL_HOST") %>
    cmd: db-schedule.sh
    env:
      clear:
        PGHOST: /var/run/postgresql
        PGUSER: verdict
    volumes:
      - /var/lib/verdict/production/postgres:/var/lib/postgresql:ro
      - /etc/verdict/production/wal-g:/etc/wal-g:ro
      - verdict-production-db-socket:/var/run/postgresql
    options:
      user: postgres
      # The restore check runs a second Postgres on a copy of the database.
      memory: 1g
