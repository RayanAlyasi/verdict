# Staging, behind an access gate and reached only through its own Cloudflare Tunnel.
proxy:
  hosts:
    - verdict-staging.alyasi.tech
    - verdict-api-staging

env:
  clear:
    APP_ENV: staging
    DEPLOYMENT_MODE: hosted

accessories:
  tunnel:
    service: verdict-staging-tunnel
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    host: <%= ENV.fetch("KAMAL_HOST") %>
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN:CLOUDFLARE_TUNNEL_TOKEN
    options:
      memory: 128m
