# Pull request preview slot 2 (specs/014), behind an access gate and served through staging's
# tunnel. preview.yml loads the pull request's images onto the server, so nothing is pulled.
registry:
  server: localhost:5555

proxy:
  hosts:
    - verdict-preview-2.alyasi.tech
    - verdict-api-preview-2

env:
  clear:
    # Staging's behaviour, including /dev/ui; previews hold no real data.
    APP_ENV: staging
    DEPLOYMENT_MODE: hosted

# Docker volumes, removed with the preview, instead of the server folders other destinations use.
volumes:
  - verdict-preview-2-storage:/app/storage

accessories:
  db:
    # Plain Postgres, with no backups: config/db/Dockerfile's base image, so keep the two in step.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    volumes:
      - verdict-preview-2-postgres:/var/lib/postgresql
