# Version updates wait 7 days after a release, so most hijacked releases are caught and pulled first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    labels: ["dependencies"]
  - package-ecosystem: uv
    directory: "/services/api"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    labels: ["dependencies"]
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    labels: ["dependencies"]
    groups:
      javascript:
        update-types: [minor, patch]
  # Base images get no security updates, only these version updates, so an OS fix waits the same
  # 7 days: take an urgent one by hand (docs/DEPLOYMENT.md).
  - package-ecosystem: docker
    directories: ["/apps/web", "/services/api", "/config/db"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    labels: ["dependencies"]
  # Kamal and its gems, for deploys only. The accessory images in config/deploy.*.yml are updated
  # by hand, since Dependabot doesn't read Kamal's config.
  - package-ecosystem: bundler
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    labels: ["dependencies"]
    groups:
      kamal:
        patterns: ["*"]
