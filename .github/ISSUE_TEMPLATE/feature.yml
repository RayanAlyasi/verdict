name: Feature
description: Propose or track a feature
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Student problem
      description: Who is struggling, and with what?
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a student be able to do when this ships?
    validations: { required: true }
  - type: input
    id: spec
    attributes:
      label: Spec
      placeholder: specs/NNN-feature-name.md (write it with /spec)
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
