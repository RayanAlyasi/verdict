name: preview
# Deploys or removes a pull request's preview after preview-build finishes, and sweeps out previews
# whose pull request closed unnoticed (specs/014). workflow_run runs this file from main, so a pull
# request can't change it. A pull request controls preview-build entirely, so nothing from that run
# is trusted: the pull request's state comes from the API, a commit deploys only if the repository
# owner pushed it (or re-ran its build), and the server gets only the image tag expected here.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [preview-build]
    types: [completed]
  # Pull request events don't run while a pull request has a merge conflict, so a closed one can be
  # missed; this catches it.
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  plan:
    name: plan
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
      slot: ${{ steps.plan.outputs.slot }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Decide what this pull request's preview needs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGERED_BY: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          none() { echo "$1"; out action none; exit 0; }
          # Only main's preview-build, run for a pull request. The number in its title is a hint,
          # checked against the pull request's own head commit below before anything deploys.
          [ "$RUN_EVENT" = pull_request ] || none "Not a pull request run."
          [ "${RUN_PATH%@*}" = .github/workflows/preview-build.yml ] || none "Not preview-build.yml."
          pr=${RUN_TITLE##* }
          [[ $pr =~ ^[0-9]+$ ]] || none "No pull request number in the run's title."
          pull=$(gh api "repos/$REPO/pulls/$pr")
          field() { jq -r "$1" <<<"$pull"; }
          state=$(field .state); merged=$(field .merged); head=$(field .head.sha); branch=$(field .head.ref)
          head_repo=$(field '.head.repo.full_name // ""'); labelled=$(field '[.labels[].name] | index("preview") != null')
          case "$state" in open | closed) ;; *) echo "::error::Unexpected pull request state: $state"; exit 1 ;; esac
          [ "$head_repo" = "$REPO" ] || none "Not a branch in this repository."
          held=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | split("\n")[0]' |
            sed -n 's/^<!-- verdict-preview slot=\([12]\) -->$/\1/p' | head -n 1)
          out pr "$pr"; out sha "$head"; out slot "$held"
          if [ "$state" != open ] || [ "$labelled" != true ]; then
            [ -n "$held" ] || none "No preview to remove."
            if [ "$merged" = true ]; then out reason "the pull request was merged"
            elif [ "$state" != open ]; then out reason "the pull request was closed"
            else out reason "the preview label was removed"; fi
            out action remove; exit 0
          fi
          # Open and labelled. Only its newest commit counts; a later run handles a newer one.
          [ "$head" = "$HEAD_SHA" ] || none "Superseded by $head."
          [ "$CONCLUSION" != cancelled ] || none "The build was cancelled."
          short=${head:0:7}
          if [ "$CONCLUSION" != success ]; then
            scripts/preview-comment.sh "$pr" "$held" "The preview of \`$short\` didn't build: $RUN_URL"
            none "The build failed."
          fi
          artifacts=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[].name] | sort | join(",")')
          [ "$artifacts" = "preview-api,preview-web" ] || none "Nothing new was built."
          # Who pushed this exact commit to the branch, from the repository's activity log.
          pusher=$(gh api -X GET "repos/$REPO/activity" -f ref="refs/heads/$branch" -f per_page=100 \
            --jq "[.[] | select(.after == \"$HEAD_SHA\" and (.activity_type == \"push\" or .activity_type == \"force_push\" or .activity_type == \"branch_creation\"))][0].actor.login // \"\"")
          if [ "$pusher" != "$OWNER" ] && ! { [ "$RUN_ATTEMPT" -gt 1 ] && [ "$TRIGGERED_BY" = "$OWNER" ]; }; then
            scripts/preview-comment.sh "$pr" "$held" \
              "\`$short\` wasn't deployed because someone other than the repository owner pushed it. Push again, or re-run its preview-build run, to deploy it."
            none "Pushed by ${pusher:-someone unknown}."
          fi
          out action deploy

  apply:
    name: ${{ needs.plan.outputs.action }} pull request ${{ needs.plan.outputs.pr }}
    needs: plan
    if: needs.plan.outputs.action == 'deploy' || needs.plan.outputs.action == 'remove'
    # A pull request's runs apply in order. GitHub cancels an older pending one when a newer one
    # queues, which is safe: each run re-reads the pull request's state. Claiming a slot is atomic on
    # the server, so different pull requests run side by side.
    concurrency:
      group: preview-${{ needs.plan.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.slot.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write # proves to Tailscale that this job runs in the preview environment
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ACTION: ${{ needs.plan.outputs.action }}
      PR: ${{ needs.plan.outputs.pr }}
      SHA: ${{ needs.plan.outputs.sha }}
      HELD: ${{ needs.plan.outputs.slot }}
      REASON: ${{ needs.plan.outputs.reason }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A missing environment secret reads as an empty string, with no error of its own.
      - name: Check the environment's secrets and variables are set (names only, never values)
        env:
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VERDICT_API_DB_PASSWORD: ${{ secrets.VERDICT_API_DB_PASSWORD }}
          VERDICT_WEB_DB_PASSWORD: ${{ secrets.VERDICT_WEB_DB_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          AI_DAILY_SPEND_LIMIT_USD: ${{ vars.AI_DAILY_SPEND_LIMIT_USD }}
        run: |
          set -euo pipefail
          required=(KAMAL_HOST TS_OAUTH_CLIENT_ID TS_AUDIENCE KAMAL_SSH_PRIVATE_KEY KAMAL_SSH_KNOWN_HOSTS
            BETTER_AUTH_SECRET ANTHROPIC_API_KEY POSTGRES_PASSWORD VERDICT_API_DB_PASSWORD
            VERDICT_WEB_DB_PASSWORD CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET AI_DAILY_SPEND_LIMIT_USD)
          missing=()
          for name in "${required[@]}"; do [ -n "${!name:-}" ] || missing+=("$name"); done
          if [ "${#missing[@]}" -gt 0 ]; then echo "::error::Set these in the preview environment: ${missing[*]}"; exit 1; fi
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        if: env.ACTION == 'deploy'
        with:
          ruby-version: "3.4"
      - name: Install Kamal from Gemfile.lock (each gem's checksum is verified)
        if: env.ACTION == 'deploy'
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install
      - name: Join the private network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:verdict-deploy
          ping: ${{ secrets.KAMAL_HOST }}
          use-cache: "false"
      - name: Configure SSH for the deploy user, with the server's host key pinned
        env:
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "Host $KAMAL_HOST" '  User kamal' '  IdentityFile ~/.ssh/id_ed25519' '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' > ~/.ssh/config
      # The server records which pull request holds each slot, in ~/.verdict-previews/<slot>. A claim
      # is created only if absent (noclobber), so two runs can't take the same slot.
      - id: slot
        name: Find or claim this pull request's slot
        env:
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
        run: |
          set -euo pipefail
          [[ $PR =~ ^[0-9]+$ ]] || { echo "::error::Unexpected pull request number"; exit 1; }
          holders() { ssh "$KAMAL_HOST" 'mkdir -p ~/.verdict-previews; for s in 1 2; do echo "$s $(cat ~/.verdict-previews/$s 2>/dev/null)"; done'; }
          claim() { ssh "$KAMAL_HOST" "set -o noclobber; echo $PR > ~/.verdict-previews/$1" 2>/dev/null; }
          mine=""; fresh=false; busy=""
          for _ in 1 2; do
            free=""; busy=""
            list=$(holders)
            while read -r s holder; do
              [ "$holder" = "$PR" ] && mine=$s
              [ -z "$holder" ] && [ -z "$free" ] && free=$s
              [ -n "$holder" ] && [ "$holder" != "$PR" ] && busy="$busy #$holder"
            done <<<"$list"
            if [ -n "$mine" ] || [ "$ACTION" = remove ] || [ -z "$free" ]; then break; fi
            if claim "$free"; then mine=$free; fresh=true; break; fi
          done
          { echo "slot=$mine"; echo "fresh=$fresh"; echo "busy=${busy# }"; } >> "$GITHUB_OUTPUT"
          if [ -n "$mine" ] && [ "$ACTION" = deploy ]; then
            echo "url=https://verdict-preview-$mine.alyasi.tech" >> "$GITHUB_OUTPUT"
          fi
      - name: Say both slots are in use
        if: env.ACTION == 'deploy' && steps.slot.outputs.slot == ''
        env:
          BUSY: ${{ steps.slot.outputs.busy }}
        run: |
          scripts/preview-comment.sh "$PR" "" \
            "Both preview slots are in use ($BUSY). Remove the \`preview\` label from one of those pull requests or close it, then add the label here again."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.ACTION == 'deploy' && steps.slot.outputs.slot != ''
        with:
          pattern: preview-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy the preview
        if: env.ACTION == 'deploy' && steps.slot.outputs.slot != ''
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          FRESH: ${{ steps.slot.outputs.fresh }}
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
          # Read by .kamal/secrets-common and the slot's config.
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAILY_SPEND_LIMIT_USD: ${{ vars.AI_DAILY_SPEND_LIMIT_USD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VERDICT_API_DB_PASSWORD: ${{ secrets.VERDICT_API_DB_PASSWORD }}
          VERDICT_WEB_DB_PASSWORD: ${{ secrets.VERDICT_WEB_DB_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          version="pr-$PR-$SHA"
          dest="preview-$SLOT"
          export APP_VERSION="$version"
          api=(-c config/deploy.api.yml -d "$dest")
          web=(-c config/deploy.web.yml -d "$dest")
          scripts/preview-comment.sh "$PR" "$SLOT" "Deploying a preview of \`${SHA:0:7}\`…"
          # The artifact comes from the pull request's run and could name any image. Load it here,
          # on the runner, and send the server only the expected tag. Each image goes just before it
          # boots, since another deploy's prune removes images no container uses yet.
          ship() {
            local want="localhost:5555/rayanalyasi/verdict/$1:$version"
            gunzip -c "$RUNNER_TEMP/images/$1.tar.gz" | docker load >/dev/null
            docker image inspect "$want" >/dev/null
            docker save "$want" | gzip -1 | ssh "$KAMAL_HOST" 'gunzip | docker load'
          }
          # Whatever an earlier pull request left in this slot goes, so this one starts empty.
          if [ "$FRESH" = true ]; then scripts/preview-remove.sh "$KAMAL_HOST" "$SLOT"; fi
          bundle exec kamal accessory boot all "${api[@]}"
          ship api
          bundle exec kamal app boot "${api[@]}" --version "$version" --roles api
          bundle exec kamal app stop "${api[@]}" --roles 'worker-*'
          bundle exec kamal app boot "${api[@]}" --version "$version" --roles 'worker-*'
          ship web
          bundle exec kamal app boot "${web[@]}" --version "$version"
          bundle exec kamal prune all "${api[@]}"
          bundle exec kamal prune all "${web[@]}"
          ./scripts/smoke-test.sh "https://verdict-$dest.alyasi.tech" "$version"
          scripts/preview-comment.sh "$PR" "$SLOT" "Preview of \`${SHA:0:7}\`: https://verdict-$dest.alyasi.tech

          It updates on each of your pushes, and goes away when this pull request closes, is merged or loses the \`preview\` label. It's behind the same login as staging."
      - name: Remove the preview
        if: env.ACTION == 'remove'
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
        run: |
          set -euo pipefail
          if [ -n "$SLOT" ]; then
            scripts/preview-remove.sh "$KAMAL_HOST" "$SLOT"
            ssh "$KAMAL_HOST" "rm -f ~/.verdict-previews/$SLOT"
          fi
          scripts/preview-comment.sh "$PR" "" "Preview removed: $REASON."
      # Keeps the slot in the comment, so a later removal still finds it.
      - name: Say it failed
        if: failure()
        env:
          SLOT: ${{ steps.slot.outputs.slot || needs.plan.outputs.slot }}
        run: |
          if [ "$ACTION" = deploy ]; then
            scripts/preview-comment.sh "$PR" "$SLOT" \
              "The preview of \`${SHA:0:7}\` didn't deploy: $RUN_URL. Push again, or re-run that run, to retry."
          else
            scripts/preview-comment.sh "$PR" "$SLOT" \
              "The preview couldn't be removed: $RUN_URL. The sweep every 6 hours tries again."
          fi

  sweep:
    name: sweep stale previews
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      id-token: write # proves to Tailscale that this job runs in the preview environment
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Join the private network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:verdict-deploy
          ping: ${{ secrets.KAMAL_HOST }}
          use-cache: "false"
      - name: Configure SSH for the deploy user, with the server's host key pinned
        env:
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "Host $KAMAL_HOST" '  User kamal' '  IdentityFile ~/.ssh/id_ed25519' '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' > ~/.ssh/config
      - name: Remove previews whose pull request isn't open with the label
        env:
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
        run: |
          set -euo pipefail
          list=$(ssh "$KAMAL_HOST" 'mkdir -p ~/.verdict-previews; for s in 1 2; do echo "$s $(cat ~/.verdict-previews/$s 2>/dev/null)"; done')
          mapfile -t slots <<<"$list"
          # A for loop, not while read: ssh would read the rest of the list from standard input.
          for line in "${slots[@]}"; do
            read -r slot pr <<<"$line"
            [ -n "$pr" ] || continue
            [[ $pr =~ ^[0-9]+$ ]] || { echo "::warning::Slot $slot holds an unexpected value"; continue; }
            pull=$(gh api "repos/$REPO/pulls/$pr")
            state=$(jq -r .state <<<"$pull")
            labelled=$(jq -r '[.labels[].name] | index("preview") != null' <<<"$pull")
            case "$state" in open | closed) ;; *) echo "::error::Unexpected state for #$pr: $state"; exit 1 ;; esac
            if [ "$state" = open ] && [ "$labelled" = true ]; then echo "Slot $slot: #$pr is still open and labelled."; continue; fi
            scripts/preview-remove.sh "$KAMAL_HOST" "$slot"
            ssh "$KAMAL_HOST" "rm -f ~/.verdict-previews/$slot"
            scripts/preview-comment.sh "$pr" "" "Preview removed: the pull request is no longer open with the \`preview\` label."
            echo "Slot $slot: removed the preview of #$pr."
          done
