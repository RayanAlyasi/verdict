name: dependency-health
on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:
permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: Check dependencies
        run: |
          set +e
          python3 scripts/dependency_health.py > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the tracking issue
        if: steps.check.outputs.status == '1'
        run: |
          set -euo pipefail
          title="Dependency health check failed"
          number=$(gh issue list --state open --label dependencies --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue comment "$number" --body-file report.md
          else gh issue create --title "$title" --label dependencies --body-file report.md; fi
      - name: Fail if the check itself errored
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '1'
        run: exit 1
