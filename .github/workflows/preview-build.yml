name: preview-build
# Builds a labelled pull request's images for preview.yml, which deploys them from main (specs/014).
# This runs the pull request's own code, so it gets no secrets and writes nothing but artifacts.
# preview.yml re-checks everything here through the API.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]
permissions: {}
concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.image }}
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
          contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-24.04-arm # the server is arm64
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: services/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The tag is the only one preview.yml will load: pr-<number>-<commit>.
      - name: Build the image as a file
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.image }}.tar
          tags: localhost:5555/rayanalyasi/verdict/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          labels: service=verdict-${{ matrix.image }}
          build-args: APP_COMMIT=${{ github.event.pull_request.head.sha }}
      - name: Compress it
        env:
          IMAGE: ${{ matrix.image }}
        run: gzip -1 "$RUNNER_TEMP/$IMAGE.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Always runs, so preview.yml hears about unlabelling and closing too.
  done:
    name: done
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report the build's result
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build: $RESULT"
          [ "$RESULT" != failure ] && [ "$RESULT" != cancelled ]
