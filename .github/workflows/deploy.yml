name: deploy
# Staging: called by ci.yml after every green push to main. Builds arm64 images once, signs their provenance, deploys them.
# Production: publishing a GitHub Release promotes the images built for staging (no rebuild), after approval.
# Rollback: run this workflow by hand from main with the version to restore. See docs/DEPLOYMENT.md and ADR 0011.
on:
  workflow_call:
    inputs:
      target:
        description: "Environment to deploy (staging)"
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Production version to roll back to, for example v0.3.2"
        type: string
        required: true
permissions: {}
concurrency:
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  images:
    name: build ${{ matrix.image }}
    if: inputs.target == 'staging'
    runs-on: ubuntu-24.04-arm # the servers are arm64; build natively, no emulation
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: services/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No build cache: these images are signed and shipped, so they're built from a clean state.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          # Baked in, because production runs this same image and reports which commit it is.
          build-args: APP_COMMIT=${{ github.sha }}
          # Kamal refuses to run an image without its service's label (config/deploy.*.yml).
          labels: service=verdict-${{ matrix.image }}
      - name: Sign build provenance (verify with `gh attestation verify oci://<image> -R <repo>`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: deploy ${{ inputs.target || 'production' }}
    needs: images
    if: ${{ !cancelled() && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target || 'production' }}
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: write
      id-token: write # proves to Tailscale that this job runs in this environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Decide destination and version
        env:
          TARGET: ${{ inputs.target }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$TARGET" = "staging" ]; then
            dest=staging; version="sha-$GITHUB_SHA"; mode=deploy
          elif [ -n "$ROLLBACK_TO" ]; then
            [[ "$ROLLBACK_TO" =~ $semver ]] || { echo "::error::Rollback version must look like v1.2.3"; exit 1; }
            dest=production; version="$ROLLBACK_TO"; mode=rollback
          else
            [[ "$RELEASE_TAG" =~ $semver ]] || { echo "::error::Release tags must look like v1.2.3"; exit 1; }
            dest=production; version="$RELEASE_TAG"; mode=promote
          fi
          { echo "dest=$dest"; echo "version=$version"; echo "mode=$mode"; } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the images built for staging (fails if this commit has none)
        if: steps.plan.outputs.mode == 'promote'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          for image in api web; do
            ref="ghcr.io/${GITHUB_REPOSITORY,,}/$image"
            docker buildx imagetools create --tag "$ref:$VERSION" "$ref:sha-$GITHUB_SHA"
          done
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
      - name: Install Kamal from Gemfile.lock (each gem's checksum is verified)
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install
      # Only deploy.yml in this environment can join (the private hosting runbook), and its tag
      # reaches nothing but the server's SSH port. The tunnel carries web traffic only.
      - name: Join the private network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:verdict-deploy
          ping: ${{ secrets.KAMAL_HOST }}
          use-cache: "false"
      - name: Configure SSH for the deploy user, with the server's host key pinned
        env:
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "Host $KAMAL_HOST" '  IdentityFile ~/.ssh/id_ed25519' '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' > ~/.ssh/config
      - name: Deploy with Kamal (api first, so migrations run before the web app relies on them)
        env:
          DEST: ${{ steps.plan.outputs.dest }}
          VERSION: ${{ steps.plan.outputs.version }}
          MODE: ${{ steps.plan.outputs.mode }}
          KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
          APP_VERSION: ${{ steps.plan.outputs.version }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # Read by .kamal/secrets-common. Keep this list in sync with it and docs/DEPLOYMENT.md.
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAILY_SPEND_LIMIT_USD: ${{ vars.AI_DAILY_SPEND_LIMIT_USD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VERDICT_API_DB_PASSWORD: ${{ secrets.VERDICT_API_DB_PASSWORD }}
          VERDICT_WEB_DB_PASSWORD: ${{ secrets.VERDICT_WEB_DB_PASSWORD }}
        run: |
          set -euo pipefail
          api=(-c config/deploy.api.yml -d "$DEST")
          web=(-c config/deploy.web.yml -d "$DEST")
          # The database and tunnel: created by the first deploy, left running after that.
          bundle exec kamal accessory boot all "${api[@]}"
          # Old workers stop before new ones start: two with the same executor ID could both resume
          # a workflow. A failed api deploy leaves them running.
          if [ "$MODE" = "rollback" ]; then
            bundle exec kamal app stop "${api[@]}" --roles 'worker-*'
            bundle exec kamal rollback "$VERSION" "${api[@]}"
            bundle exec kamal rollback "$VERSION" "${web[@]}"
          else
            bundle exec kamal deploy "${api[@]}" --skip-push --version "$VERSION" --roles api
            bundle exec kamal app stop "${api[@]}" --roles 'worker-*'
            bundle exec kamal app boot "${api[@]}" --version "$VERSION" --roles 'worker-*'
            bundle exec kamal deploy "${web[@]}" --skip-push --version "$VERSION"
          fi
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: ./scripts/smoke-test.sh "$APP_URL"
