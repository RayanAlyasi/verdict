# Local development services only. Staging and production are deployed with Kamal (see docs/DEPLOYMENT.md).
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
      POSTGRES_DB: verdict
      VERDICT_API_DB_PASSWORD: verdict_api
      VERDICT_WEB_DB_PASSWORD: verdict_web
    ports:
      - "127.0.0.1:5432:5432"   # this machine only: the passwords here are public
    volumes:
      - db-data:/var/lib/postgresql   # Postgres 18 images keep data in a versioned folder under this path
      # The api and web roles, as in staging and production; they run only on a new volume.
      - ./config/db/10-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./config/db/20-role-passwords.sh:/docker-entrypoint-initdb.d/20-role-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict"]
      interval: 5s
      retries: 10
volumes:
  db-data:
